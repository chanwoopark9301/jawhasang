<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>自畵像</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#8c7b6b" />

  <!-- iOS PWA — 홈 화면 추가 시 주소창 제거 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="自畵像" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260505-02" />
</head>
<body>
  <!-- 앱 초기화 완료 전 FOUC 방지 스플래시 (JS가 render() 후 제거) -->
  <div id="app-splash">
    <div id="app-splash-logo">自畵像</div>
  </div>

  <div class="app" id="app">

    <!-- 패널 백드롭 (모바일 전용) -->
    <div class="panel-backdrop" id="panel-backdrop" onclick="closePanels()"></div>

    <!-- 왼쪽 사이드바 (데스크탑: 항상 고정, 모바일: 오버레이) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo" onclick="showHome();closePanels();" title="홈으로">自畵像</div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">메뉴</div>
        <div class="nav-item" id="nav-my" onclick="setView('myrecords')">
          <span class="nav-dot dot-my">●</span> 일상
        </div>
        <div class="sub-items" id="sub-my"></div>

        <div class="nav-item" id="nav-sv" onclick="setView('student')">
          <span class="nav-dot dot-sv">●</span> 상담
        </div>
        <div class="sub-items" id="sub-sv"></div>

        <div class="nav-item" id="nav-invest" onclick="setView('investment')">
          <span class="nav-dot dot-invest">●</span> 투자
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="export-btn" onclick="exportData()" title="JSON 백업 다운로드">↓ 내보내기</button>
        <a href="/logout" class="logout-link">로그아웃</a>
      </div>
    </aside>

    <!-- 중앙 메인 -->
    <main class="main" id="main">
      <!-- 상단 헤더 -->
      <div class="main-header" id="main-header">
        <!-- 모바일 토글 버튼 (모바일에서만 표시) -->
        <button class="header-panel-btn mobile-only" onclick="toggleSidebar()" title="목록">☰</button>

        <!-- 컨텍스트 칩 -->
        <div class="context-chip" id="ctx-topic" onclick="openTopicPicker()">
          <span class="chip-dot" id="ctx-dot"></span>
          <span id="ctx-topic-label">自畵像</span>
          <span class="chip-arrow">▾</span>
        </div>
        <div class="ctx-role-label" id="ctx-role-label"></div>

        <!-- 오른쪽: 새 항목 버튼 + 모바일 AI 토글 -->
        <div class="main-header-right">
          <button class="btn-secondary" id="ns-btn" style="display:none;" onclick="handleNsBtn()">
            + 회기 추가
          </button>
          <button class="header-panel-btn mobile-only" onclick="toggleAIPanel()" title="AI 도구">✦</button>
        </div>

        <!-- JS 호환용 히든 요소 -->
        <div id="main-title" style="display:none;"></div>
        <div id="main-sub" style="display:none;"></div>
      </div>

      <!-- 메인 콘텐츠 -->
      <div class="main-content" id="main-content">
        <div class="empty-state">불러오는 중...</div>
      </div>

      <!-- 하단 입력창 (대화 탭 활성 시만 표시) -->
      <div class="input-area" id="input-area" style="display:none;">
        <div class="input-wrap">
          <button class="input-plus" onclick="openPlusMenu()" title="더 보기">+</button>
          <textarea class="input-field" id="chat-input-bottom"
            placeholder="정리 안 된 말 그대로 적어도 돼요"
            rows="1"
            onkeydown="handleChatKey(event)"></textarea>
          <button class="input-send" onclick="sendCurrentChat()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 12V2M2 7l5-5 5 5" stroke="white" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <!-- 오른쪽 패널 (데스크탑: 항상 고정, 모바일: 오버레이) -->
    <aside class="right-panel ai-panel" id="right-panel">
      <div class="ai-header">
        <span id="ai-header-title">AI 도구</span>
        <button class="panel-close-btn mobile-only" onclick="closePanels()" title="닫기">✕</button>
      </div>

      <!-- 현재 주제/내담자 -->
      <div class="rp-section">
        <div class="rp-label">현재</div>
        <div class="rp-value" id="rp-topic" onclick="openTopicPicker()">주제 없음</div>
      </div>

      <!-- AI 역할 (나의 기록 전용) -->
      <div class="rp-section" id="rp-role-section" style="display:none;">
        <div class="rp-label">AI 역할</div>
        <div class="role-pills" id="rp-role-pills"></div>
      </div>

      <!-- 기간 선택 (나의 기록 보고서 전용) -->
      <div class="rp-section" id="rp-period-section" style="display:none;">
        <div class="rp-label">보고서 기간</div>
        <div class="period-btns" id="rp-period-btns"></div>
      </div>

      <div class="ai-content" id="ai-content">
        <p class="ai-placeholder">항목을 선택하면<br>정보가 표시됩니다</p>
      </div>

      <!-- 도구 버튼 -->
      <div class="ai-footer">
        <!-- 상담 기록 전용 -->
        <button class="analyze-btn" id="rp-report-btn" disabled onclick="runCurrentAI()">
          슈퍼비전 보고서 ↗
        </button>
        <button class="transform-btn" id="rp-transform-btn" disabled onclick="handleTransform()" style="display:none;">
          축어록 AI 정리 ↗
        </button>
        <!-- 공통 (뷰에 따라 활성 조건 분기) -->
        <button class="ai-tool-btn-sm" id="rp-pattern-btn" disabled onclick="runCurrentPattern()">
          패턴 분석 ↗
        </button>
        <button class="ai-tool-btn-sm" id="rp-deepq-btn" disabled onclick="runDeepQuestion()">
          심층 질문 ↗
        </button>
        <button class="ai-tool-btn-sm" id="rp-timeline-btn" disabled onclick="runGrowthTimeline()">
          성장 타임라인 ↗
        </button>
      </div>
    </aside>

    <!-- 모바일 하단 내비게이션 -->
    <nav class="mobile-nav" id="mobile-nav">
      <button class="mnav-btn" id="mnav-list" onclick="toggleSidebar()">
        <span class="mnav-icon">☰</span>
        <span class="mnav-label">목록</span>
      </button>
      <button class="mnav-btn active" id="mnav-main" onclick="closePanels()">
        <span class="mnav-icon">◧</span>
        <span class="mnav-label">화면</span>
      </button>
      <button class="mnav-btn" id="mnav-ai" onclick="toggleAIPanel()">
        <span class="mnav-icon">✦</span>
        <span class="mnav-label">AI</span>
      </button>
    </nav>

    <!-- 캘린더 날짜 팝업 -->
    <div class="cal-popup-overlay" id="cal-popup-overlay" style="display:none;" onclick="closeCalPopup()"></div>
    <div class="cal-popup-modal" id="cal-popup-modal" style="display:none;"></div>

    <!-- 전체 패턴 분석 모달 -->
    <div class="cal-popup-overlay" id="pattern-modal-overlay" style="display:none;" onclick="closePatternModal()"></div>
    <div class="pattern-modal" id="pattern-modal" style="display:none;"></div>

    <!-- 일기 초안 모달 -->
    <div class="cal-popup-overlay" id="diary-draft-overlay" style="display:none;" onclick="closeDiaryDraft()"></div>
    <div class="diary-draft-modal" id="diary-draft-modal" style="display:none;"></div>

    <!-- 새 대화 모달 -->
    <div class="cal-popup-overlay" id="new-chat-overlay" style="display:none;" onclick="closeNewChatModal()"></div>
    <div class="new-chat-modal" id="new-chat-modal" style="display:none;"></div>

    <!-- 심층 질문 모달 -->
    <div class="cal-popup-overlay" id="deep-q-overlay" style="display:none;" onclick="closeDeepQuestion()"></div>
    <div class="deep-q-modal" id="deep-q-modal" style="display:none;"></div>

    <!-- 성장 타임라인 모달 -->
    <div class="cal-popup-overlay" id="timeline-overlay" style="display:none;" onclick="closeTimeline()"></div>
    <div class="timeline-modal" id="timeline-modal" style="display:none;"></div>

    <!-- 통합 모달 -->
    <div class="modal-overlay" id="modal-overlay" onclick="handleModalOverlayClick(event)">
      <div class="modal-box" id="modal-box"></div>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

  </div>

  <!-- 모듈 로드 순서: 의존성 순 -->
  <script src="js/logger.js?v=20260505-02"></script>
  <script src="js/state.js?v=20260505-02"></script>
  <script src="js/utils.js?v=20260505-02"></script>
  <script src="js/data.js?v=20260505-02"></script>
  <script src="js/nav.js?v=20260505-02"></script>
  <script src="js/crud.js?v=20260505-02"></script>
  <script src="js/ai-counseling.js?v=20260505-02"></script>
  <script src="js/ai-myrecords.js?v=20260505-02"></script>
  <script src="js/ai-pattern.js?v=20260505-02"></script>
  <script src="js/modal.js?v=20260505-02"></script>
  <script src="js/panels.js?v=20260505-02"></script>
  <script src="js/chat.js?v=20260505-02"></script>
  <script src="js/investment-rules.js?v=20260505-02"></script>
  <script src="js/investment-api.js?v=20260505-02"></script>
  <script src="js/market-data.js?v=20260505-02"></script>
  <script src="js/render-sidebar.js?v=20260505-02"></script>
  <script src="js/render-calendar.js?v=20260505-02"></script>
  <script src="js/render-investment.js?v=20260505-02"></script>
  <script src="js/verbatim-editor.js?v=20260505-02"></script>
  <script src="js/render-aipanel.js?v=20260505-02"></script>
  <script src="js/render-main.js?v=20260505-02"></script>
  <script src="js/render-home.js?v=20260505-02"></script>
  <script src="js/transform-text.js?v=20260505-02"></script>
  <script src="app.js?v=20260505-02"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(err => console.warn('SW 등록 실패:', err));
      });
      // SW 업데이트 감지 → 자동 새로고침
      // prevController: 이전 SW가 있었을 때만 reload (첫 설치는 무시)
      const _swPrev = navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!_swPrev) return;                          // 첫 설치 — 리로드 불필요
        if (sessionStorage.getItem('sw_reloaded')) return; // 무한루프 방지
        sessionStorage.setItem('sw_reloaded', '1');
        window.location.reload();
      });
    }
  </script>
</body>
</html>
