<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>自畵像</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#8c7b6b" />

  <!-- iOS PWA — 홈 화면 추가 시 주소창 제거 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="自畵像" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- 패널 백드롭 (패널 열릴 때 배경 어둡게) -->
    <div class="panel-backdrop" id="panel-backdrop" onclick="closePanels()"></div>

    <!-- 사이드바 (왼쪽 오버레이) -->
    <aside class="sidebar" id="sidebar">
      <!-- 로고 + 닫기 -->
      <div class="sidebar-logo-area">
        <div class="sidebar-logo" onclick="showHome();closePanels();" title="홈으로">自畵像</div>
        <button class="panel-close-btn" onclick="closePanels()" title="닫기">✕</button>
      </div>

      <!-- 3-버튼 네비게이션 -->
      <nav class="sidebar-nav">
        <button id="btn-dv" class="nav-btn nav-btn-my" onclick="setView('myrecords')">
          <span class="nav-dot nav-dot-my">●</span>나의 기록
        </button>
        <button id="btn-sv" class="nav-btn nav-btn-counsel active" onclick="setView('student')">
          <span class="nav-dot nav-dot-counsel">●</span>상담 기록
        </button>
        <button id="btn-cal" class="nav-btn nav-btn-cal" onclick="setView('calendar')">
          <span class="nav-dot nav-dot-cal">○</span>캘린더
        </button>
      </nav>

      <!-- 컨텍스트 영역 (주제/학생 목록) -->
      <div class="sidebar-context" id="sidebar-context">
        <input class="sidebar-search" id="sidebar-search" type="search"
          placeholder="검색..." oninput="setSearchQuery(this.value)" autocomplete="off" />
        <div class="sidebar-list" id="sidebar-list"></div>
        <button class="add-btn" id="add-btn" onclick="handleAdd()">+ 새 내담자</button>
      </div>

      <!-- 하단 유틸 -->
      <div class="sidebar-footer">
        <button class="export-btn" onclick="exportData()" title="JSON 백업 다운로드">↓ 내보내기</button>
        <a href="/logout" class="logout-link">로그아웃</a>
      </div>
    </aside>

    <!-- 메인 컨텐츠 (전체 너비) -->
    <main class="main" id="main">
      <div class="main-header">
        <!-- 왼쪽: 목록 토글 -->
        <button class="header-panel-btn" onclick="toggleSidebar()" title="목록">☰</button>

        <!-- 중앙: 타이틀 -->
        <div class="main-header-center">
          <div class="main-title" id="main-title">自畵像</div>
          <div class="main-sub" id="main-sub"></div>
        </div>

        <!-- 오른쪽: 새 항목 버튼 + AI 토글 -->
        <div class="main-header-right">
          <button class="btn-secondary" id="ns-btn" style="display:none;" onclick="handleNsBtn()">
            + 회기 추가
          </button>
          <button class="header-panel-btn" onclick="toggleAIPanel()" title="AI 도구">✦</button>
        </div>
      </div>
      <div class="main-content" id="main-content">
        <div class="empty-state">왼쪽에서 학생을 선택하거나<br>새 학생을 추가해보세요</div>
      </div>
    </main>

    <!-- AI 분석 패널 (오른쪽 오버레이) -->
    <aside class="ai-panel" id="ai-panel">
      <div class="ai-header">
        <span id="ai-header-title">AI 도구</span>
        <button class="panel-close-btn" onclick="closePanels()" title="닫기">✕</button>
      </div>
      <div class="ai-content" id="ai-content">
        <p class="ai-placeholder">회기를 선택하면<br>AI 분석을 요청할 수 있어요</p>
      </div>
      <div class="ai-footer">
        <button class="analyze-btn" id="analyze-btn" disabled onclick="runAI()">
          슈퍼비전 보고서 생성 ↗
        </button>
        <button class="transform-btn" id="transform-btn" disabled onclick="handleTransform()">
          축어록 AI 정리 ↗
        </button>
      </div>
    </aside>

    <!-- 모바일 하단 내비게이션 -->
    <nav class="mobile-nav" id="mobile-nav">
      <button class="mnav-btn" id="mnav-list" onclick="toggleSidebar()">
        <span class="mnav-icon">☰</span>
        <span class="mnav-label">목록</span>
      </button>
      <button class="mnav-btn active" id="mnav-main" onclick="closePanels()">
        <span class="mnav-icon">◧</span>
        <span class="mnav-label">화면</span>
      </button>
      <button class="mnav-btn" id="mnav-ai" onclick="toggleAIPanel()">
        <span class="mnav-icon">✦</span>
        <span class="mnav-label">AI</span>
      </button>
    </nav>

    <!-- 캘린더 날짜 팝업 -->
    <div class="cal-popup-overlay" id="cal-popup-overlay" style="display:none;" onclick="closeCalPopup()"></div>
    <div class="cal-popup-modal" id="cal-popup-modal" style="display:none;"></div>

    <!-- 전체 패턴 분석 모달 -->
    <div class="cal-popup-overlay" id="pattern-modal-overlay" style="display:none;" onclick="closePatternModal()"></div>
    <div class="pattern-modal" id="pattern-modal" style="display:none;"></div>

    <!-- 일기 초안 모달 -->
    <div class="cal-popup-overlay" id="diary-draft-overlay" style="display:none;" onclick="closeDiaryDraft()"></div>
    <div class="diary-draft-modal" id="diary-draft-modal" style="display:none;"></div>

  </div>
  <!-- 모듈 로드 순서: 의존성 순 -->
  <script src="js/logger.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ai-counseling.js"></script>
  <script src="js/ai-myrecords.js"></script>
  <script src="js/ai-pattern.js"></script>
  <script src="js/render-sidebar.js"></script>
  <script src="js/render-calendar.js"></script>
  <script src="js/verbatim-editor.js"></script>
  <script src="js/render-forms.js"></script>
  <script src="js/render-session.js"></script>
  <script src="js/render-myrecords-view.js"></script>
  <script src="js/render-aipanel.js"></script>
  <script src="js/render-main.js"></script>
  <script src="js/render-home.js"></script>
  <script src="js/transform-text.js"></script>
  <script src="js/resize.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(err => console.warn('SW 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
